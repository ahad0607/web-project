{% extends "base.html" %}
{% block title %}Log Chelation Therapy{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card shadow p-4 border-danger">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="fw-bold mb-0 text-danger"><i class="fas fa-heartbeat me-2"></i>Log Iron Chelation Adherence</h4>
          <a href="{{ url_for('care.medications') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </div>
        <p class="text-muted small">
          Chelation therapy prevents life-threatening cardiac and liver hemosiderosis in chronically transfused thalassemia patients.
        </p>

        <form method="POST" action="{{ url_for('care.record_chelation') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold">Patient <span class="text-danger">*</span></label>
              <select name="patient_id" class="form-select" required>
                <option value="">-- Select Patient --</option>
                {% for p in patients %}
                  <option value="{{ p.id }}">{{ p.full_name }} (MRN: {{ p.mrn }})</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Iron Chelator Drug <span class="text-danger">*</span></label>
              <select name="medication_id" class="form-select" required>
                <option value="">-- Select Chelator --</option>
                {% for m in medications %}
                  <option value="{{ m.id }}">{{ m.name }} ({{ m.generic_name }})</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Daily Dosage (mg) <span class="text-danger">*</span></label>
              <input type="number" step="10" name="dosage_mg" class="form-control" value="500" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Frequency</label>
              <input type="text" name="frequency" class="form-control" value="Once Daily">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Patient Compliance / Adherence (%)</label>
              <input type="number" min="0" max="100" name="adherence_percentage" class="form-control" value="95">
              <div class="form-text small">Goal: &ge; 90% adherence</div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Prescribing Doctor</label>
              <select name="doctor_id" class="form-select">
                <option value="">-- Attending Doctor --</option>
                {% for d in doctors %}
                  <option value="{{ d.id }}">{{ d.full_name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Observed Side Effects</label>
              <input type="text" name="side_effects_noted" class="form-control" value="None reported">
            </div>
          </div>

          <div class="mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-danger px-4 fw-semibold">
              <i class="fas fa-save me-1"></i> Save Chelation Record
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
