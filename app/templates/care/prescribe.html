{% extends "base.html" %}
{% block title %}Prescribe Medication{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fw-bold mb-0 text-danger"><i class="fas fa-prescription me-2"></i>Prescribe to Patient</h4>
          <a href="{{ url_for('care.medications') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </div>

        <form method="POST" action="{{ url_for('care.prescribe') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold">Patient <span class="text-danger">*</span></label>
              <select name="patient_id" class="form-select" required>
                <option value="">-- Choose Patient --</option>
                {% for p in patients %}
                  <option value="{{ p.id }}">{{ p.full_name }} (MRN: {{ p.mrn }})</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Medication <span class="text-danger">*</span></label>
              <select name="medication_id" class="form-select" required>
                <option value="">-- Choose Medication --</option>
                {% for m in medications %}
                  <option value="{{ m.id }}">{{ m.name }} ({{ m.drug_class }})</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Prescribing Doctor</label>
              <select name="doctor_id" class="form-select">
                <option value="">-- Prescribing Doctor --</option>
                {% for d in doctors %}
                  <option value="{{ d.id }}">{{ d.full_name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Dosage (mg / tablets) <span class="text-danger">*</span></label>
              <input type="text" name="dosage" class="form-control" placeholder="e.g. 500 mg" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Frequency <span class="text-danger">*</span></label>
              <select name="frequency" class="form-select" required>
                <option value="Once Daily">Once Daily</option>
                <option value="Twice Daily">Twice Daily</option>
                <option value="Three Times Daily">Three Times Daily</option>
                <option value="Every 12 Hours">Every 12 Hours</option>
              </select>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Patient Administration Instructions</label>
              <textarea name="instructions" class="form-control" rows="2" placeholder="e.g. Dissolve tablet in 100ml water using non-metallic spoon, drink 30 mins before breakfast"></textarea>
            </div>
          </div>

          <div class="mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-danger px-4 fw-semibold">Save Prescription</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
