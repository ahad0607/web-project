{% extends "base.html" %}
{% block title %}Register Patient{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fw-bold mb-0"><i class="fas fa-user-plus text-danger me-2"></i>Register Thalassemia Patient</h4>
          <a href="{{ url_for('patients.index') }}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i> Back to Registry</a>
        </div>

        <form method="POST" action="{{ url_for('patients.create') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-12"><h6 class="fw-bold text-danger border-bottom pb-2">1. Patient Account & Personal Information</h6></div>
            
            <div class="col-md-6">
              <label class="form-label fw-semibold">Patient Full Name <span class="text-danger">*</span></label>
              <input type="text" name="full_name" class="form-control" placeholder="Zainab Khan" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
              <input type="email" name="email" class="form-control" placeholder="zainab@example.com" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
              <input type="tel" name="phone" class="form-control" placeholder="0300-1234567" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">CNIC / B-Form Number</label>
              <input type="text" name="cnic" class="form-control" placeholder="42101-1234567-1">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Date of Birth <span class="text-danger">*</span></label>
              <input type="date" name="date_of_birth" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Gender <span class="text-danger">*</span></label>
              <select name="gender" class="form-select" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Blood Group <span class="text-danger">*</span></label>
              <select name="blood_group_id" class="form-select" required>
                <option value="">-- Select Blood Group --</option>
                {% for bg in blood_groups %}
                  <option value="{{ bg.id }}">{{ bg.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Weight (kg)</label>
              <input type="number" step="0.5" name="weight_kg" class="form-control" value="25.0">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Height (cm)</label>
              <input type="number" step="0.5" name="height_cm" class="form-control" value="115.0">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">City</label>
              <select name="city_id" class="form-select">
                <option value="">-- Select City --</option>
                {% for c in cities %}
                  <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12 mt-4"><h6 class="fw-bold text-danger border-bottom pb-2">2. Clinical & Transfusion Settings</h6></div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Primary Hospital / Center</label>
              <select name="primary_hospital_id" class="form-select">
                <option value="">-- Choose Treatment Facility --</option>
                {% for h in hospitals %}
                  <option value="{{ h.id }}">{{ h.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Supervising Hematologist / Doctor</label>
              <select name="primary_doctor_id" class="form-select">
                <option value="">-- Select Doctor --</option>
                {% for doc in doctors %}
                  <option value="{{ doc.id }}">{{ doc.full_name }} ({{ doc.specialization }})</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Diagnosis</label>
              <select name="diagnosis_id" class="form-select">
                <option value="">-- Diagnosis Category --</option>
                {% for diag in diagnoses %}
                  <option value="{{ diag.id }}">{{ diag.name }} ({{ diag.code }})</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-3">
              <label class="form-label fw-semibold">Baseline Hb (g/dL)</label>
              <input type="number" step="0.1" name="baseline_hemoglobin" class="form-control" value="7.0">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Cycle (Days)</label>
              <input type="number" name="transfusion_interval_days" class="form-control" value="21">
            </div>

            <div class="col-12 mt-4"><h6 class="fw-bold text-danger border-bottom pb-2">3. Emergency Guardian Contact</h6></div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Contact Person Name <span class="text-danger">*</span></label>
              <input type="text" name="emergency_contact_name" class="form-control" placeholder="Guardian or Parent" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Emergency Phone <span class="text-danger">*</span></label>
              <input type="tel" name="emergency_contact_phone" class="form-control" placeholder="0300-7654321" required>
            </div>
          </div>

          <div class="mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-danger px-4 py-2 fw-semibold">
              <i class="fas fa-check-circle me-1"></i> Complete Patient Registration
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
