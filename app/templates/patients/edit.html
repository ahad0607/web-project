{% extends "base.html" %}
{% block title %}Edit Patient - {{ patient.mrn }}{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fw-bold mb-0"><i class="fas fa-edit text-danger me-2"></i>Edit Patient Record ({{ patient.mrn }})</h4>
          <a href="{{ url_for('patients.view', id=patient.id) }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </div>

        <form method="POST" action="{{ url_for('patients.edit', id=patient.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Patient Name</label>
              <input type="text" name="full_name" class="form-control" value="{{ patient.full_name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone Number</label>
              <input type="tel" name="phone" class="form-control" value="{{ patient.user.phone if patient.user else '' }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Weight (kg)</label>
              <input type="number" step="0.5" name="weight_kg" class="form-control" value="{{ patient.weight_kg }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Height (cm)</label>
              <input type="number" step="0.5" name="height_cm" class="form-control" value="{{ patient.height_cm }}">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Primary Hospital</label>
              <select name="primary_hospital_id" class="form-select">
                <option value="">-- Choose Hospital --</option>
                {% for h in hospitals %}
                  <option value="{{ h.id }}" {% if patient.primary_hospital_id == h.id %}selected{% endif %}>{{ h.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Supervising Doctor</label>
              <select name="primary_doctor_id" class="form-select">
                <option value="">-- Choose Doctor --</option>
                {% for doc in doctors %}
                  <option value="{{ doc.id }}" {% if patient.primary_doctor_id == doc.id %}selected{% endif %}>{{ doc.full_name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Diagnosis</label>
              <select name="diagnosis_id" class="form-select">
                <option value="">-- Choose Diagnosis --</option>
                {% for diag in diagnoses %}
                  <option value="{{ diag.id }}" {% if patient.diagnosis_id == diag.id %}selected{% endif %}>{{ diag.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-3">
              <label class="form-label fw-semibold">Baseline Hb (g/dL)</label>
              <input type="number" step="0.1" name="baseline_hemoglobin" class="form-control" value="{{ patient.baseline_hemoglobin }}">
            </div>

            <div class="col-md-3">
              <label class="form-label fw-semibold">Transfusion Cycle (Days)</label>
              <input type="number" name="transfusion_interval_days" class="form-control" value="{{ patient.transfusion_interval_days }}">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Emergency Contact Name</label>
              <input type="text" name="emergency_contact_name" class="form-control" value="{{ patient.emergency_contact_name }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Emergency Phone</label>
              <input type="tel" name="emergency_contact_phone" class="form-control" value="{{ patient.emergency_contact_phone }}">
            </div>
          </div>

          <div class="mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-danger px-4 fw-semibold">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
