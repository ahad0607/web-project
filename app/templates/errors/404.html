{% extends "base.html" %}
{% block title %}404 - Not Found{% endblock %}
{% block content %}
<div class="container text-center py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="display-1 text-warning fw-bold"><i class="fas fa-search"></i> 404</div>
      <h2 class="mt-3 fw-bold">Page Not Found</h2>
      <p class="text-muted">The requested patient record, blood request, or page could not be found or has been archived.</p>
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-3">
        <i class="fas fa-home me-2"></i>Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
