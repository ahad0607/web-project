{% extends "base.html" %}
{% block title %}403 - Forbidden{% endblock %}
{% block content %}
<div class="container text-center py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="display-1 text-danger fw-bold"><i class="fas fa-lock"></i> 403</div>
      <h2 class="mt-3 fw-bold">Access Forbidden</h2>
      <p class="text-muted">You do not have permission to access this resource or administrative section.</p>
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-3">
        <i class="fas fa-home me-2"></i>Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
