{% extends "base.html" %}
{% block title %}500 - Server Error{% endblock %}
{% block content %}
<div class="container text-center py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="display-1 text-danger fw-bold"><i class="fas fa-exclamation-triangle"></i> 500</div>
      <h2 class="mt-3 fw-bold">Internal Server Error</h2>
      <p class="text-muted">A server-side transaction failed. Changes have been automatically rolled back to preserve database integrity.</p>
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-3">
        <i class="fas fa-home me-2"></i>Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
