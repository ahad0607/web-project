{% extends "base.html" %}
{% block title %}Edit Hospital{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fw-bold mb-0"><i class="fas fa-edit text-danger me-2"></i>Edit Facility Details</h4>
          <a href="{{ url_for('hospitals.view', id=hospital.id) }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </div>

        <form method="POST" action="{{ url_for('hospitals.edit', id=hospital.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label fw-semibold">Hospital Name</label>
              <input type="text" name="name" class="form-control" value="{{ hospital.name }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">City</label>
              <select name="city_id" class="form-select">
                {% for c in cities %}
                  <option value="{{ c.id }}" {% if hospital.city_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Address</label>
              <input type="text" name="address" class="form-control" value="{{ hospital.address }}" required>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Phone</label>
              <input type="tel" name="phone" class="form-control" value="{{ hospital.phone }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" name="email" class="form-control" value="{{ hospital.email or '' }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Emergency Hotline</label>
              <input type="text" name="emergency_hotline" class="form-control" value="{{ hospital.emergency_hotline or '' }}">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Total Beds</label>
              <input type="number" name="total_beds" class="form-control" value="{{ hospital.total_beds }}">
            </div>
            <div class="col-md-4 d-flex align-items-center mt-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="has_blood_bank" id="bbCheck" {% if hospital.has_blood_bank %}checked{% endif %}>
                <label class="form-check-label fw-semibold" for="bbCheck">Has Blood Bank</label>
              </div>
            </div>
            <div class="col-md-4 d-flex align-items-center mt-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="has_thalassemia_center" id="tcCheck" {% if hospital.has_thalassemia_center %}checked{% endif %}>
                <label class="form-check-label fw-semibold" for="tcCheck">Has Thalassemia Center</label>
              </div>
            </div>
          </div>

          <div class="mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-danger px-4 fw-semibold">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
