{% extends "base.html" %}
{% block title %}Organize Campaign Drive{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fw-bold mb-0 text-danger"><i class="fas fa-flag me-2"></i>Organize Blood Donation Drive</h4>
          <a href="{{ url_for('campaigns.index') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </div>

        <form method="POST" action="{{ url_for('campaigns.create') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold">Campaign Drive Title <span class="text-danger">*</span></label>
              <input type="text" name="title" class="form-control" placeholder="e.g. Annual FAST-NUCES Thalassemia Blood Drive" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Affiliated Hospital / Blood Center <span class="text-danger">*</span></label>
              <select name="hospital_id" class="form-select" required>
                <option value="">-- Choose Hospital --</option>
                {% for h in hospitals %}
                  <option value="{{ h.id }}">{{ h.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">City</label>
              <select name="city_id" class="form-select">
                <option value="">-- Select City --</option>
                {% for c in cities %}
                  <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Drive Venue & Location <span class="text-danger">*</span></label>
              <input type="text" name="venue" class="form-control" placeholder="e.g. Main Auditorium, FAST Campus, Shah Latif Town, Karachi" required>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Start Date <span class="text-danger">*</span></label>
              <input type="date" name="start_date" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">End Date <span class="text-danger">*</span></label>
              <input type="date" name="end_date" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Target Units</label>
              <input type="number" name="target_units" class="form-control" value="100" min="10">
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Campaign Description & Purpose</label>
              <textarea name="description" class="form-control" rows="3" placeholder="Blood collection drive dedicated to pediatric thalassemia patients..."></textarea>
            </div>
          </div>

          <div class="mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-danger px-4 fw-semibold">Launch Blood Drive</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
