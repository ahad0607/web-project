{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-lg p-4">
        <div class="text-center mb-4">
          <i class="fas fa-heartbeat text-danger fs-1 mb-2"></i>
          <h3 class="fw-bold">Sign In</h3>
          <p class="text-muted small">Access LifeBridge Patient & Blood Portal</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username or Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
              <input type="text" name="login_identifier" class="form-control" placeholder="admin@lifebridge.com" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-key"></i></span>
              <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" name="remember" class="form-check-input" id="rememberCheck">
            <label class="form-check-label small" for="rememberCheck">Keep me signed in</label>
          </div>

          <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">
            <i class="fas fa-sign-in-alt me-1"></i> Sign In
          </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center small text-muted">
          Need an account? <a href="{{ url_for('auth.register') }}" class="text-danger fw-semibold">Register here</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
