{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
      <div class="card shadow p-4">
        <div class="text-center mb-4">
          <i class="fas fa-user-plus text-danger fs-1 mb-2"></i>
          <h3 class="fw-bold">Create Account</h3>
          <p class="text-muted small">Join LifeBridge as a Donor, Patient, Doctor, or Medical Staff</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
              <input type="text" name="username" class="form-control" placeholder="john_doe" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
              <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
              <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
              <input type="tel" name="phone" class="form-control" placeholder="0300-1234567" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">CNIC / National ID</label>
              <input type="text" name="cnic" class="form-control" placeholder="42101-1234567-1">
              <div class="form-text small">13 digits format</div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Account Role <span class="text-danger">*</span></label>
              <select name="role_id" class="form-select" required>
                <option value="">-- Choose Role --</option>
                {% for r in roles %}
                  <option value="{{ r.id }}">{{ r.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">City</label>
              <select name="city_id" class="form-select">
                <option value="">-- Select City --</option>
                {% for c in cities %}
                  <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Residential Address</label>
              <input type="text" name="address" class="form-control" placeholder="Street, Neighborhood">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
              <input type="password" name="password" class="form-control" minlength="6" placeholder="Min. 6 chars" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
              <input type="password" name="confirm_password" class="form-control" minlength="6" placeholder="Re-enter password" required>
            </div>
          </div>

          <div class="mt-4">
            <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">
              <i class="fas fa-check-circle me-1"></i> Complete Registration
            </button>
          </div>
        </form>

        <div class="mt-4 pt-3 border-top text-center small text-muted">
          Already registered? <a href="{{ url_for('auth.login') }}" class="text-danger fw-semibold">Sign in here</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
