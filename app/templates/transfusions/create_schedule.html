{% extends "base.html" %}
{% block title %}Schedule Transfusion{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fw-bold mb-0 text-danger"><i class="fas fa-calendar-plus me-2"></i>Schedule Thalassemia Transfusion</h4>
          <a href="{{ url_for('transfusions.schedules') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </div>

        <form method="POST" action="{{ url_for('transfusions.create_schedule') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold">Thalassemia Patient <span class="text-danger">*</span></label>
              <select name="patient_id" class="form-select" required>
                <option value="">-- Choose Patient (MRN) --</option>
                {% for p in patients %}
                  <option value="{{ p.id }}">{{ p.full_name }} (MRN: {{ p.mrn }} - {{ p.blood_group.name }})</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Treatment Hospital <span class="text-danger">*</span></label>
              <select name="hospital_id" class="form-select" required>
                <option value="">-- Select Hospital --</option>
                {% for h in hospitals %}
                  <option value="{{ h.id }}">{{ h.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Attending Doctor</label>
              <select name="doctor_id" class="form-select">
                <option value="">-- Primary Doctor --</option>
                {% for d in doctors %}
                  <option value="{{ d.id }}">{{ d.full_name }} ({{ d.specialization }})</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Transfusion Date <span class="text-danger">*</span></label>
              <input type="date" name="scheduled_date" class="form-control" required>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Required Units</label>
              <input type="number" min="1" max="5" name="required_units" class="form-control" value="1">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Target Hb (g/dL)</label>
              <input type="number" step="0.1" name="target_hemoglobin" class="form-control" value="9.5">
            </div>

            <div class="col-12">
              <div class="form-check p-3 border rounded bg-danger-subtle border-danger">
                <input class="form-check-input" type="checkbox" name="auto_request_blood" id="autoReqCheck" checked>
                <label class="form-check-label fw-semibold text-danger" for="autoReqCheck">
                  <i class="fas fa-link me-1"></i> Automatically generate and link an urgent Blood Requisition
                </label>
                <div class="form-text small text-dark">
                  Ensures the hospital blood bank crossmatches and reserves the required PRBC units before the patient arrives.
                </div>
              </div>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Clinical Notes / Instructions</label>
              <textarea name="notes" class="form-control" rows="2" placeholder="e.g. Saline washed PRBC requested due to minor febrile history"></textarea>
            </div>
          </div>

          <div class="mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-danger px-4 fw-semibold">
              <i class="fas fa-check-circle me-1"></i> Confirm Transfusion Schedule
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
