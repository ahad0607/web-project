{% extends "base.html" %}
{% block title %}Add Blood Unit{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fw-bold mb-0 text-danger"><i class="fas fa-plus-circle me-2"></i>Add Bagged Blood Unit</h4>
          <a href="{{ url_for('inventory.units') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </div>

        <form method="POST" action="{{ url_for('inventory.add_unit') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Receiving Blood Bank <span class="text-danger">*</span></label>
              <select name="blood_bank_id" class="form-select" required>
                <option value="">-- Choose Blood Bank --</option>
                {% for b in blood_banks %}
                  <option value="{{ b.id }}">{{ b.hospital.name if b.hospital else b.license_number }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Blood Group <span class="text-danger">*</span></label>
              <select name="blood_group_id" class="form-select" required>
                <option value="">-- Select Blood Group --</option>
                {% for bg in blood_groups %}
                  <option value="{{ bg.id }}">{{ bg.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Component Type</label>
              <select name="component_type" class="form-select">
                <option value="PRBC">PRBC (Packed Red Blood Cells)</option>
                <option value="Whole Blood">Whole Blood</option>
                <option value="Platelets">Platelets</option>
                <option value="FFP">FFP (Fresh Frozen Plasma)</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Volume (mL)</label>
              <input type="number" name="volume_ml" class="form-control" value="450">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Donation Collection Date</label>
              <input type="date" name="donation_date" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Expiry Date (auto +35 days if blank)</label>
              <input type="date" name="expiry_date" class="form-control">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Associated Donor (optional)</label>
              <select name="donor_id" class="form-select">
                <option value="">-- Direct / Anonymous Collection --</option>
                {% for d in donors %}
                  <option value="{{ d.id }}">{{ d.full_name }} ({{ d.blood_group.name }})</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Storage Location</label>
              <input type="text" name="storage_location" class="form-control" value="Refrigerator Main - Shelf A">
            </div>
          </div>

          <div class="mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-danger px-4 fw-semibold">
              <i class="fas fa-check-circle me-1"></i> Confirm & Store Blood Unit
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
