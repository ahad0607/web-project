{% extends "base.html" %}
{% block title %}Adjust Unit Status{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="fw-bold mb-0"><i class="fas fa-sliders-h text-danger me-2"></i>Adjust Unit Status</h4>
          <a href="{{ url_for('inventory.view_unit', id=unit.id) }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </div>
        <p class="text-muted small">
          Unit: <strong>{{ unit.unit_number }}</strong> &bull; Group: <strong>{{ unit.blood_group.name }}</strong>
        </p>

        <form method="POST" action="{{ url_for('inventory.edit_unit', id=unit.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Inventory Status</label>
            <select name="status" class="form-select" required>
              <option value="Available" {% if unit.status == 'Available' %}selected{% endif %}>Available</option>
              <option value="Reserved" {% if unit.status == 'Reserved' %}selected{% endif %}>Reserved (Pre-transfusion Crossmatch)</option>
              <option value="Transfused" {% if unit.status == 'Transfused' %}selected{% endif %}>Transfused</option>
              <option value="Expired" {% if unit.status == 'Expired' %}selected{% endif %}>Expired</option>
              <option value="Discarded" {% if unit.status == 'Discarded' %}selected{% endif %}>Discarded (Hemolysis / Contamination)</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Storage Location</label>
            <input type="text" name="storage_location" class="form-control" value="{{ unit.storage_location }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Reason for Status Change</label>
            <textarea name="reason" class="form-control" rows="2" placeholder="e.g. Discarded due to bag rupture or expired shelf life"></textarea>
          </div>

          <button type="submit" class="btn btn-danger w-100 fw-semibold">Save Adjustment</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
