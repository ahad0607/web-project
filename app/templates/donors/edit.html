{% extends "base.html" %}
{% block title %}Edit Donor{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fw-bold mb-0"><i class="fas fa-edit text-danger me-2"></i>Edit Donor Profile</h4>
          <a href="{{ url_for('donors.view', id=donor.id) }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </div>

        <form method="POST" action="{{ url_for('donors.edit', id=donor.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Full Name</label>
              <input type="text" name="full_name" class="form-control" value="{{ donor.full_name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone Number</label>
              <input type="tel" name="phone" class="form-control" value="{{ donor.user.phone if donor.user else '' }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Weight (kg)</label>
              <input type="number" step="0.5" name="weight_kg" class="form-control" value="{{ donor.weight_kg }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Preferred Donation Hospital</label>
              <select name="preferred_donation_center_id" class="form-select">
                <option value="">-- Choose Hospital --</option>
                {% for h in hospitals %}
                  <option value="{{ h.id }}" {% if donor.preferred_donation_center_id == h.id %}selected{% endif %}>{{ h.name }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-danger px-4 fw-semibold">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
