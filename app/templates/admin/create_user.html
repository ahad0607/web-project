{% extends "base.html" %}
{% block title %}Create User Account{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fw-bold mb-0 text-primary"><i class="fas fa-user-plus me-2"></i>Create System User</h4>
          <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </div>

        <form method="POST" action="{{ url_for('admin.create_user') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
              <input type="text" name="username" class="form-control" placeholder="staff_ahmed" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
              <input type="email" name="email" class="form-control" placeholder="ahmed@lifebridge.com" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
              <input type="text" name="full_name" class="form-control" placeholder="Ahmed Siddiqui" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
              <input type="tel" name="phone" class="form-control" placeholder="0300-1122334" required>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Assigned Role <span class="text-danger">*</span></label>
              <select name="role_id" class="form-select" required>
                <option value="">-- Choose Role --</option>
                {% for r in roles %}
                  <option value="{{ r.id }}">{{ r.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">City</label>
              <select name="city_id" class="form-select">
                <option value="">-- Choose City --</option>
                {% for c in cities %}
                  <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Assigned Hospital</label>
              <select name="hospital_id" class="form-select">
                <option value="">-- None / N/A --</option>
                {% for h in hospitals %}
                  <option value="{{ h.id }}">{{ h.name }}</option>
                {% endfor %}
              </select>
              <small class="text-muted">Mandatory for hospital staff</small>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Initial Password <span class="text-danger">*</span></label>
              <input type="password" name="password" class="form-control" minlength="8" placeholder="Min. 8 chars with letters & numbers" required>
            </div>
          </div>

          <div class="mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-primary px-4 fw-semibold"><i class="fas fa-check-circle me-1"></i> Create Account</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
