{% extends "base.html" %}
{% block title %}Edit User - @{{ user.username }}{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h4 class="fw-bold mb-0 text-primary"><i class="fas fa-user-edit me-2"></i>Edit User Account</h4>
            <span class="text-muted small">Username: <strong>@{{ user.username }}</strong></span>
          </div>
          <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary btn-sm">Back to Users</a>
        </div>

        <form method="POST" action="{{ url_for('admin.edit_user', id=user.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Username</label>
              <input type="text" class="form-control" value="{{ user.username }}" disabled readonly>
              <small class="text-muted">Usernames are immutable for security audit integrity.</small>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
              <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
              <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone Number</label>
              <input type="tel" name="phone" class="form-control" value="{{ user.phone or '' }}" placeholder="0300-1122334">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Assigned Role <span class="text-danger">*</span></label>
              <select name="role_id" class="form-select" required>
                {% for r in roles %}
                  <option value="{{ r.id }}" {% if user.role_id == r.id %}selected{% endif %}>{{ r.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">City</label>
              <select name="city_id" class="form-select">
                <option value="">-- Choose City --</option>
                {% for c in cities %}
                  <option value="{{ c.id }}" {% if user.city_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Assigned Hospital</label>
              <select name="hospital_id" class="form-select">
                <option value="">-- None / N/A --</option>
                {% for h in hospitals %}
                  <option value="{{ h.id }}" {% if user.hospital_id == h.id %}selected{% endif %}>{{ h.name }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
            <button type="submit" class="btn btn-primary px-4 fw-semibold"><i class="fas fa-save me-1"></i> Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
